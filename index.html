<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b5bdb">
  <title>행동중재 도우미</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧩</span>
      <span>행동중재 도우미</span>
    </div>
    <label class="student-picker">
      <span class="sr-only">학생 선택</span>
      <select id="studentSelect" data-change="selectStudent"></select>
    </label>
  </header>

  <nav class="nav" id="nav">
    <button data-view="home"><span>🏠</span>홈</button>
    <button data-view="behaviors"><span>🎯</span>표적행동</button>
    <button data-view="record"><span>✏️</span>기록</button>
    <button data-view="calendar"><span>📅</span>달력</button>
    <button data-view="graph"><span>📈</span>그래프</button>
    <button data-view="plan"><span>📝</span>중재계획</button>
    <button data-view="settings"><span>⚙️</span>설정</button>
  </nav>

  <main id="main" class="main"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" data-action="closeModal" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="printArea"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/export.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
